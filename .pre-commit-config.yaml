repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin to a specific ruff hook version; update as you prefer.
    rev: v0.13.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    # Pick a tag that works for you; you can autoupdate after.
    rev: v1.18.2
    hooks:
      - id: mypy

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
